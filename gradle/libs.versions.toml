[versions]
agp = "8.9.1"
kotlin = "2.1.10"
camera = "1.4.1"
room = "2.6.1"
[plugins]
android = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.1.10-1.0.31" }
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version = "2025.02.00" }
material3 = { module = "androidx.compose.material3:material3" }
ui = { module = "androidx.compose.ui:ui" }
tooling = { module = "androidx.compose.ui:ui-tooling-preview" }
activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.8.7" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.8.7" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camera" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camera" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camera" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camera" }
barcode = { module = "com.google.mlkit:barcode-scanning", version = "17.3.0" }
ocr = { module = "com.google.mlkit:text-recognition", version = "16.0.1" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
koin = { module = "io.insert-koin:koin-android", version = "4.0.2" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version = "2.11.0" }
converter = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version = "2.11.0" }
json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.8.0" }
coil = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.10.0" }
junit = { module = "junit:junit", version = "4.13.2" }
